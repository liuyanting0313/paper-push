# arXiv 论文周报 - GitHub Actions 专用配置(会被提交到 git 仓库)
# 与本地的 config.yaml 不同: 本文件不包含真实密码, 密码统一从环境变量 EMAIL_PASSWORD 读取
# (在 GitHub 仓库的 Settings -> Secrets and variables -> Actions 中配置 EMAIL_PASSWORD)
#
# 提醒: 本文件包含发件人/收件人邮箱地址, 建议将本仓库设为私有(Private)仓库以保护隐私

arxiv:
  categories:
    - cs.RO
    - eess.SY
    - cs.SY
    - cs.AI
    - cs.LG

  keywords:
    - "unmanned surface vessel"
    - "USV"
    - "surface vehicle"
    - "autonomous vessel"
    - "trajectory tracking"
    - "path following"
    - "sensor fusion"
    - "state estimation"
    - "obstacle avoidance"
    - "underactuated surface vessel"
    - "autonomous ship"

  exclude_keywords: []

  keyword_weights:
    "unmanned surface vessel": 3
    "USV": 2

  # 每周汇总模式: 覆盖过去 7 天
  days_back: 7
  max_results: 120
  max_send: 20

  # 文献检索来源列表: arxiv(默认) / semantic_scholar(免费 API, 覆盖期刊/会议论文, 含引用数据)
  sources:
    - arxiv
    - semantic_scholar

  semantic_scholar:
    max_results: 50
    timeout: 20
    # 建议通过环境变量 SEMANTIC_SCHOLAR_API_KEY 配置(可选, 未配置也可用但限流配额更低)
    api_key: ""

email:
  enabled: true
  smtp_server: smtp.qq.com
  smtp_port: 465
  use_ssl: true
  sender: "2549388745@qq.com"
  sender_name: "无人船学术速递"
  # 占位符, 实际发信时会被环境变量 EMAIL_PASSWORD(GitHub Secrets)覆盖, 本字段不会被使用
  password: "__set_via_EMAIL_PASSWORD_env_var__"
  receiver: "contact@liuyanting0313.com"
  subject_prefix: "[arXiv无人船与智能控制前沿]"

storage:
  # sent_ids.json 在 GitHub Actions 中会被工作流自动 commit & push 回仓库, 用于跨次运行去重
  sent_ids_file: "sent_ids.json"
  sent_ids_retention_days: 60
  ignore_version_in_dedup: true

logging:
  log_file: "logs/arxiv_digest.log"

llm:
  # LLM 精读要点默认关闭; 若要启用, 在 GitHub Secrets 中配置 LLM_API_KEY, 并将 enabled 设为 true
  enabled: true
  label: "免费模型"
  # 使用 OpenRouter 的 OpenAI 兼容接口, 配合 OpenRouter 账户下新建的 API Key(LLM_API_KEY)
  base_url: "https://openrouter.ai/api/v1"
  # OpenRouter 上的免费模型, 需带 :free 后缀; 免费模型会不定期下线/轮换, 若收到 404 需去
  # https://openrouter.ai/models?max_price=0 核对最新可用的模型 id 并更新此处
  model: "qwen/qwen3.8-27b:free"
  api_key: ""
  timeout: 60
  # 备用模型候选链(可选): 若 model 改名/下线导致调用报错(404/模型不存在), 会自动依次尝试
  # 这里列出的备用模型; OpenRouter 还会额外做一次全量可用模型列表比对作为更可靠的首选探测方式
  fallback_models:
    - "nvidia/nemotron-3-super-120b-a12b:free"
    - "google/gemma-4-31b-it:free"

  # 对比模型: 同时调用已付费的 DeepSeek, 邮件中两段大白话速读并列展示, 便于对比效果
  # 需要在 GitHub Secrets 中配置 DEEPSEEK_API_KEY; 不需要对比时将 enabled 设为 false 即可(节省额度)
  compare:
    enabled: true
    label: "DeepSeek"
    base_url: "https://api.deepseek.com/v1"
    model: "deepseek-flash"
    api_key_env: "DEEPSEEK_API_KEY"
    api_key: ""
    timeout: 60
    # DeepSeek 若未来改名/下线当前模型, 会自动依次尝试这里列出的备用模型
    fallback_models:
      - "deepseek-chat"
      - "deepseek-reasoner"

site:
  # 详情页(完整摘要/AI精读要点/翻译/BibTeX)的发布地址, 通过 GitHub Pages 托管
  # 需要在仓库 Settings -> Pages 中选择 "Deploy from a branch" -> main -> /docs 目录
  # 邮件正文只放精简内容 + 本链接, 规避部分邮件客户端(如 iPhone Gmail App)不支持
  # <details> 折叠标签的问题; 详情页本身是普通网页, 折叠交互不受邮件客户端限制
  base_url: "https://liuyanting0313.github.io/paper-push"
  output_dir: "docs/digest"

push:
  # Webhook 推送默认关闭; 若要启用, 在 GitHub Secrets 中配置 PUSH_WEBHOOK_URL, 并将 enabled 设为 true
  enabled: false
  channel: "wecom"
  webhook_url: ""
  max_items: 10
